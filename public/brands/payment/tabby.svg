<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 56" fill="none" role="img" aria-label="Tabby">
  <!-- Tabby green pill icon -->
  <rect x="0" y="8" width="40" height="40" rx="20" fill="#3DCC91"/>
  <!-- Tabby cat ears (stylized) -->
  <path d="M12 20 L16 13 L20 20z" fill="white" opacity="0.85"/>
  <path d="M20 20 L24 13 L28 20z" fill="white" opacity="0.85"/>
  <!-- Cat face circle -->
  <circle cx="20" cy="26" r="7" fill="white"/>
  <!-- Eyes -->
  <circle cx="17.5" cy="25" r="1.2" fill="#3DCC91"/>
  <circle cx="22.5" cy="25" r="1.2" fill="#3DCC91"/>
  <!-- Nose + mouth -->
  <path d="M19.2 27.5 L20 28.5 L20.8 27.5" stroke="#3DCC91" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Tabby wordmark in bold black (brand standard) -->
  <text x="50" y="35" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#1A1A1A" letter-spacing="-0.5">tabby</text>
</svg>

