<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="Tamara">
  <!-- Tamara icon: stylized wave + T -->
  <!-- Teal rounded square -->
  <rect x="0" y="4" width="48" height="48" rx="12" fill="#00D4AA"/>
  <!-- T crossbar -->
  <rect x="10" y="15" width="28" height="6.5" rx="3.25" fill="white"/>
  <!-- T stem -->
  <rect x="20.75" y="21.5" width="6.5" height="16" rx="3.25" fill="white"/>
  <!-- Tamara wordmark -->
  <text x="60" y="35" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#00A88A" letter-spacing="-0.4">tamara</text>
</svg>

