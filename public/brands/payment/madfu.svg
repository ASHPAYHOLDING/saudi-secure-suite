<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Background pill -->
  <rect width="200" height="60" rx="12" fill="#0A1628"/>
  <!-- Madfu brand mark: stylised M + arc representing installment flow -->
  <path d="M20 42 L28 18 L36 34 L44 18 L52 42" stroke="#00C896" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arc / BNPL wave -->
  <path d="M18 46 Q36 50 54 46" stroke="#00C896" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Text: Madfu in English -->
  <text x="66" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Madfu</text>
  <!-- Text: مدفو in Arabic -->
  <text x="66" y="46" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#00C896" letter-spacing="0.3">مدفو</text>
  <!-- BNPL badge -->
  <rect x="138" y="16" width="46" height="18" rx="9" fill="#00C896" opacity="0.15"/>
  <text x="161" y="29" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#00C896" text-anchor="middle">BNPL</text>
</svg>
